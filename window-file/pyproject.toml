[project]
name = "window-file"
version = "0.1.0"
description = "Community Window canonical endpoint and local admin service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "jsonschema>=4.25.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
